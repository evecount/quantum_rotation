<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Project Q-Rotate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script>
    // Automatic smart redirection for common path variations
    (function() {
      const path = window.location.pathname;
      const base = '/quantum_rotation/';

      // 1. If URL has /docs/ prefix, redirect without /docs/
      if (path.includes('/docs/')) {
        const cleanPath = path.replace('/docs/', '/');
        window.location.replace(cleanPath);
        return;
      }

      // 2. If constellation without .html
      if (path.endsWith('/constellation') || path.endsWith('/constellation/')) {
        window.location.replace(base + 'constellation.html');
        return;
      }

      // 3. If workbook without .html
      if (path.endsWith('/workbook') || path.endsWith('/workbook/')) {
        window.location.replace(base + 'workbook.html');
        return;
      }

      // 4. If any markdown file was requested directly, redirect to documentation section
      if (path.endsWith('.md')) {
        window.location.replace(base + '#docs');
        return;
      }
    })();
  </script>
  <style>
    :root {
      --bg-dark: #05070d;
      --accent-cyan: #00f5d4;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(0, 245, 212, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
    }
    .card {
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 24px;
      padding: 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(0, 245, 212, 0.15);
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-shadow: 0 0 25px rgba(0, 245, 212, 0.5);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
      color: #040814;
      box-shadow: 0 4px 20px rgba(0, 245, 212, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 245, 212, 0.5);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Quantum Phase Trajectory Diverged</h1>
    <p>
      The coordinate you navigated to does not exist in our Hilbert space. Choose a destination below to realign into ground-state synchrony:
    </p>
    <div class="btn-grid">
      <a href="index.html" class="btn btn-primary">
        <span>🏠 Documentation Portal & Home</span>
      </a>
      <a href="constellation.html" class="btn btn-secondary">
        <span>🌌 3D Resonance Constellation Game</span>
      </a>
      <a href="workbook.html" class="btn btn-secondary">
        <span>⚡ Interactive Web Workbook</span>
      </a>
    </div>
  </div>
</body>
</html>
