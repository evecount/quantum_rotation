<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#01040c" />
  <title>404 | Project Q-Rotate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script>
    // Automatic smart redirection for common path variations
    (function() {
      const path = window.location.pathname;
      const base = '/quantum_rotation/';

      // 1. If URL has /docs/ prefix, redirect without /docs/
      if (path.includes('/docs/')) {
        const cleanPath = path.replace('/docs/', '/');
        window.location.replace(cleanPath);
        return;
      }

      // 2. If constellation without .html
      if (path.endsWith('/constellation') || path.endsWith('/constellation/')) {
        window.location.replace(base + 'constellation.html');
        return;
      }

      // 3. If workbook without .html
      if (path.endsWith('/workbook') || path.endsWith('/workbook/')) {
        window.location.replace(base + 'workbook.html');
        return;
      }

      // 4. If any markdown file was requested directly, redirect to documentation section
      if (path.endsWith('.md')) {
        window.location.replace(base + '#docs');
        return;
      }
    })();
  </script>
  <style>
    :root {
      --bg-dark: #01040c;
      --accent-cyan: #00f5d4;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      /* Clean deep void ground */
    }
    .card {
      background: rgba(10, 16, 30, 0.92);
      border: 1px solid rgba(0, 245, 212, 0.28);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(0, 245, 212, 0.12),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 8px;
      border-radius: 9999px;
      background: rgba(0, 245, 212, 0.08);
      border: 1px solid rgba(0, 245, 212, 0.25);
      margin-bottom: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.8rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-shadow: 0 0 25px rgba(0, 245, 212, 0.5);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.04em;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary {
      background: #00f5d4;
      color: #01040c;
      box-shadow: 0 4px 18px rgba(0, 245, 212, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 245, 212, 0.5);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 245, 212, 0.4);
      color: var(--accent-cyan);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-badge">
      <svg viewBox="0 0 36 36" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">
        <circle cx="18" cy="18" r="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="2 2" />
        <ellipse cx="18" cy="18" rx="14.5" ry="6.2" transform="rotate(-28 18 18)" stroke="#00f5d4" stroke-width="1.4" />
        <circle cx="18" cy="18" r="7" stroke="#38bdf8" stroke-width="1.8" />
        <path d="M22 22L28 28" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="18" cy="18" r="2.8" fill="#ffffff" />
        <circle cx="18" cy="18" r="1.5" fill="#00f5d4" />
      </svg>
      <span>Project Q-Rotate</span>
    </div>
    <div class="code">404</div>
    <h1>Quantum Phase Trajectory Diverged</h1>
    <p>
      The coordinate you requested does not exist in our Hilbert space. Realign into ground-state synchrony:
    </p>
    <div class="btn-grid">
      <a href="index.html" class="btn btn-primary">
        <span>Documentation Portal & Overview</span>
      </a>
      <a href="constellation.html" class="btn btn-secondary">
        <span>3D Resonance Constellation</span>
      </a>
      <a href="simulation.html" class="btn btn-secondary">
        <span>Interactive Quantum Simulation</span>
      </a>
    </div>
  </div>
</body>
</html>
