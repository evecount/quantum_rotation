## 🎯 Why this challenge exists
This track is designed to help participants explore how quantum computing can be applied to meaningful, real-world challenges while also building readiness for the arrival of **Helios in Singapore**. Over the course of the challenge, teams will move from problem exploration to solution development, using Quantinuum software, tools, resources, and mentor guidance to test ideas, build prototypes, and gain hands-on experience with practical quantum-enabled approaches.

The goal is not only to identify strong technical solutions, but also to help participants develop the software familiarity, workflow experience, and applied quantum skills needed to take advantage of next-generation quantum hardware as it becomes available in Singapore. This track is also intended to strengthen collaboration and contribute to a growing quantum innovation ecosystem in Singapore and beyond.

---

## 👥 Who is this track for?
This track is open to students, researchers, developers, startups, and innovators who are interested in applying quantum computing to real-world problems. Participants may come from backgrounds such as quantum information, computer science, engineering, chemistry, optimization, AI, finance, logistics, or other applied domains.

You do not need to be a quantum expert to participate. Teams with a mix of technical, domain, and product perspectives are encouraged, especially those who are eager to learn, experiment, and build practical solutions with support from mentors and available challenge resources.

---

## 🚀 How to get started?
Review the challenge details, form a team, choose a problem to tackle, and begin developing your quantum-enabled solution. Participants are encouraged to use available learning resources, mentor sessions, and platform tools throughout the challenge. Final submission requirements and key dates will be shared in the challenge timeline.

---

## 🔬 R&D Themes

* **Quantum Primitives:** Hamiltonian simulation methods to find strongly correlated ground states for physics-based models.
* **Chemistry:** Electronic structure simulation methods to predict chemical properties in battery development and drug development that frustrate classical computers.
* **AI for Quantum:** Generative AI methods to improve hardware utilization, resource requirements, and time/quality to solution.
* **QEC (Quantum Error Correction):** Enabler for reliable quantum computation by improving (correcting) defects (errors) in quantum compute. This is required firmware for fault-tolerance.
* **Optimization:** Enables industries such as finance, logistics, and energy to more efficiently solve complex decision problems, for example portfolio allocation, routing, and scheduling.
* **Open Innovation:** Bring your own use case—any industrially relevant challenge where quantum computing could make a difference (your own industry problem, novel applications of Quantinuum systems, cross-disciplinary ideas).

---

## 📋 Problem Statements

Concrete problems teams can tackle within the R&D themes above. Each statement gives the scientific context, the question to answer, and the reference literature to start from.

### 1. Quantum-HPC Hybrid Biomolecular Simulation *(Our Selected Track)*
* **Theme:** Chemistry
* **Context:** Many biologically important photochemical processes depend on excited electronic states that are difficult to model because the number of relevant electron configurations grows rapidly with system size.
* **The Challenge:** Can quantum computers and classical supercomputers work together to efficiently capture these complex electronic effects and improve the accuracy of biomolecular simulations?
* **References:**
  * [arXiv:2601.15677](https://arxiv.org/pdf/2601.15677)
  * [arXiv:2605.01138v1](https://arxiv.org/pdf/2605.01138v1)

### 2. X-ray Absorption Spectroscopy
* **Theme:** Chemistry
* **Context:** Accurate simulation of X-ray absorption spectra (XAS), particularly transition-metal $L_{2,3}$-edge spectra, requires modelling strong electron-correlation effects that are difficult for conventional methods such as Density Functional Theory (DFT) and multiple-scattering approaches. Existing classical methods struggle to scale while maintaining chemical accuracy for strongly correlated systems.
* **The Challenge:** Can Quantum Phase Estimation (QPE), combined with qubit-efficient circuits and error-detection techniques, accurately reproduce XAS spectra on current trapped-ion quantum hardware?
* **References:**
  * [arXiv:2505.08612v2](https://arxiv.org/html/2505.08612v2)
  * [arXiv:2509.24664v1](https://arxiv.org/html/2509.24664v1)

### 3. Error-Corrected Quantum Chemistry
* **Themes:** QEC, Chemistry
* **Context:** Quantum Phase Estimation offers an asymptotically efficient route to molecular energy calculations, but its deep circuits are highly sensitive to noise and exceed the capabilities of unprotected quantum hardware. While quantum error correction (QEC) is widely recognized as essential for scalable quantum chemistry, end-to-end demonstrations of a quantum chemistry workflow using fully encoded logical qubits remain limited.
* **The Challenge:** Demonstrate that QPE can be executed within a practical QEC framework and deliver chemically meaningful molecular energy estimates. Specifically, can logical qubits protected by quantum error correction improve computational fidelity sufficiently to enable accurate molecular energy calculations on current trapped-ion quantum processors?
* **References:**
  * [arXiv:2505.09133](https://arxiv.org/pdf/2505.09133)
  * [arXiv:2306.16608](https://arxiv.org/pdf/2306.16608)

### 4. Quantum Search
* **Theme:** Quantum Primitives
* **Context:** Can a quantum computer uncover a hidden pattern in a black-box function exponentially faster than any known classical algorithm (Simon's Algorithm)? Given a black-box function containing a hidden XOR relationship, how can we efficiently uncover the secret bit string that links pairs of inputs producing identical outputs?
* **The Challenge:** Classical algorithms require exponentially many function evaluations, while Simon's quantum algorithm solves the problem in polynomial time.

## ⚖️ Official Judging Framework

Four core evaluation criteria on a common **0–5 Evidence Scale**. Every score traces directly to a documented artifact and rationale.

| Scoring Dimension | Weight | What Judges Look For | Required Evidence to Cite |
| :--- | :---: | :--- | :--- |
| **Problem & Value** | **30%** | Need clarity; solution fit; quantified customer or business value | Problem/user validation; use-case evidence; business case or ROI |
| **Technical Performance & Hardware Use** | **30%** | Correctness; benchmark gains; scalability; hardware utilization | Benchmark data; run logs; job metadata; demo results |
| **Scientific Merit** | **20%** | Novelty; methodological rigor; improvement versus a baseline | Algorithm rationale; baseline comparison; error and validation analysis |
| **Engineering & Reproducibility** | **20%** | Code structure; testing; documentation; repeatable setup | Clean repository; README; unit test results; reproduction record |

### Common Evidence Scale (0–5)
$$\\text{Weighted Points} = \\left(\\frac{\\text{Rating}}{5}\\right) \\times \\text{Criterion Weight}$$

* **0 — No evidence:** Assertion with zero supporting material.
* **1 — Assertion only:** Claim made without empirical validation.
* **2 — Plausible; limited proof:** Conceptual argument with partial demonstration.
* **3 — Demonstrated with direct evidence:** Working code and measured prototype results.
* **4 — Measured and repeatable:** Full end-to-end benchmark suite with deterministic reproduction.
* **5 — Validated against a benchmark, user need, or external reference:** Validated against external experimental reference data (e.g. RCSB Protein Data Bank crystal structures) and verified on native hardware emulator.
